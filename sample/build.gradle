plugins {
    alias libs.plugins.android.application
}

android {
    namespace "com.github.barteksc.sample"

    compileSdk libs.versions.android.sdk.compile.get().toInteger()
    buildToolsVersion libs.versions.android.build.tools.get()

    defaultConfig {
        minSdkVersion libs.versions.android.sdk.min.get()
        targetSdkVersion libs.versions.android.sdk.target.get()

        versionCode 3
        versionName libs.versions.project.get()

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }
    }
}

dependencies {
    implementation project(':android-pdf-viewer')
    implementation libs.androidx.appcompat
    implementation libs.androidannotations.api
    annotationProcessor libs.androidannotations.processor
}
